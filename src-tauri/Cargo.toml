[package]
name = "roster"
version = "1.2.20"
description = "Desktop command center for multiple AI CLIs"
authors = ["you"]
edition = "2021"

[lib]
name = "roster_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` is scoped to Tauri's native child-WebView API used by Relax mode.
# Cargo.lock pins the verified Tauri 2.11.x implementation for reproducible builds.
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
rust_xlsxwriter = "0.68"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
opener = "0.7"
portable-pty = "0.8"
base64 = "0.22"
trash = "5"
tempfile = "3.27"
rusqlite = { version = "0.32", features = ["bundled"] }
# 内嵌远程服务（手机端局域网控制终端）
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
local-ip-address = "0.6"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }  # 仅 SVG，不拉 image 依赖

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSEvent", "block2"] }
block2 = "0.6.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
xattr = "1.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
